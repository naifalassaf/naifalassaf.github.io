<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>درب — نموذج تصميمي مقترح</title>
    <!-- a client mockup: keep it out of search results -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#004053" />
    <link rel="icon" href="/darb/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/darb/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var q = new URLSearchParams(location.search).get('lang')
        var l = q === 'en' || q === 'ar' ? q : localStorage.getItem('darb.lang')
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/darb/main.tsx"></script>
  </body>
</html>
