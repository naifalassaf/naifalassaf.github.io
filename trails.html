<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مسارات السعودية — البراري</title>
    <meta name="description" content="خريطة ثنائية اللغة لمسارات الهايكنج في السعودية من محمية الملك سلمان الملكية وجمعية درب. Saudi Trails: a bilingual map of hiking trails from the King Salman Royal Reserve and Darb." />
    <meta property="og:title" content="مسارات السعودية · Saudi Trails" />
    <meta property="og:description" content="Hiking trails from the King Salman Royal Reserve and Darb, on one map, in Arabic and English." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naifalassaf.github.io/trails" />
    <meta name="theme-color" content="#F2E9DA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // set the language before first paint so the layout doesn't flip
      try {
        var q = new URLSearchParams(location.search).get('lang')
        var l = q === 'en' || q === 'ar' ? q : localStorage.getItem('trails.lang')
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/trails/main.tsx"></script>
  </body>
</html>
